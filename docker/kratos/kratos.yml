# Browser URLs are overridden by compose.yaml from the local .env.
# DSN and secrets must come from the environment; there is no memory fallback.
serve:
  public:
    base_url: http://127.0.0.1:14433/
    cors:
      enabled: true
      allow_credentials: true
      allowed_origins:
        - http://127.0.0.1:3042
        - http://127.0.0.1:14455
      allowed_methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
      allowed_headers: [Authorization, Content-Type, Cookie, X-CSRF-Token]
      exposed_headers: [Content-Type, Set-Cookie]
  admin:
    base_url: http://kratos:4434/

selfservice:
  default_browser_return_url: http://127.0.0.1:14455/welcome
  allowed_return_urls:
    - http://127.0.0.1:14455/
    - http://127.0.0.1:3042/
  methods:
    password:
      enabled: true
    code:
      enabled: true
  flows:
    error:
      ui_url: http://127.0.0.1:14455/error
    login:
      ui_url: http://127.0.0.1:14455/login
      lifespan: 10m
      after:
        hooks:
          - hook: require_verified_address
    registration:
      ui_url: http://127.0.0.1:14455/registration
      lifespan: 10m
      after:
        password:
          hooks:
            - hook: show_verification_ui
    settings:
      ui_url: http://127.0.0.1:14455/settings
      privileged_session_max_age: 15m
    recovery:
      enabled: true
      ui_url: http://127.0.0.1:14455/recovery
      use: code
    verification:
      enabled: true
      ui_url: http://127.0.0.1:14455/verification
      use: code
      after:
        default_browser_return_url: http://127.0.0.1:14455/login
    logout:
      after:
        default_browser_return_url: http://127.0.0.1:14455/login

session:
  lifespan: 24h
  cookie:
    name: fleet_kratos_session
    same_site: Lax

cookies:
  same_site: Lax

log:
  level: info
  format: json
  leak_sensitive_values: false

ciphers:
  algorithm: xchacha20-poly1305

hashers:
  algorithm: argon2

identity:
  default_schema_id: fleet-user-v1
  schemas:
    - id: fleet-user-v1
      url: file:///etc/config/kratos/identity.schema.json

courier:
  smtp:
    connection_uri: smtp://mailpit:1025/?disable_starttls=true
    from_address: no-reply@fleet.local
    from_name: Fleet Development

feature_flags:
  use_continue_with_transitions: true
