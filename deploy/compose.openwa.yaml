# Optional POC service. Use with compose.yaml locally or deploy/compose.yaml on the server.
# Dashboard is loopback-only; no Docker socket or production database access.
services:
  openwa:
    image: ghcr.io/rmyndharis/openwa:0.29.1
    restart: unless-stopped
    init: true
    mem_limit: 1g
    memswap_limit: 1536m
    shm_size: 256m
    stop_grace_period: 75s
    ports: [127.0.0.1:2785:2785]
    environment:
      NODE_ENV: production
      PORT: "2785"
      ENGINE_TYPE: whatsapp-web.js
      DATABASE_TYPE: sqlite
      API_MASTER_KEY: ${OPENWA_MASTER_KEY:?Set OPENWA_MASTER_KEY in the root .env}
      API_KEY_PEPPER: ${OPENWA_KEY_PEPPER:?Set OPENWA_KEY_PEPPER in the root .env}
      SEND_PACING_ENABLED: "true"
      MCP_ENABLED: "false"
    volumes: [openwa_data:/app/data]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, curl, -f, http://localhost:2785/api/health/ready]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
volumes:
  openwa_data:
